<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0907">
  <title>العالم فون</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== شاشة البداية ===== -->
  <div id="splash">
    <div class="orb"></div>
    <img class="splash-logo" src="assets/logo.png" alt="">
    <div class="splash-title">العالم فون</div>
    <div class="splash-bar"><span></span></div>
  </div>

  <!-- ===== تسجيل الدخول ===== -->
  <section id="login" class="screen hidden">
    <div class="orb"></div>
    <div class="login-card">
      <img class="login-logo" src="assets/logo.png" alt="">
      <h1>مرحباً بك</h1>
      <p class="muted">سجّل الدخول لإدارة المحل</p>
      <form id="login-form">
        <label class="field">
          <span>اسم المستخدم</span>
          <input id="login-user" autocomplete="username" required>
        </label>
        <label class="field">
          <span>كلمة السر</span>
          <input id="login-pass" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="error hidden"></p>
        <button class="btn-primary" type="submit"><span>دخول</span></button>
      </form>
    </div>
  </section>

  <!-- ===== التطبيق ===== -->
  <div id="app" class="hidden">
    <!-- الرئيسية -->
    <section class="view active" data-view="home">
      <header class="hero">
        <div>
          <p class="muted" id="greeting">مرحباً</p>
          <h1>لوحة التحكم</h1>
        </div>
        <img class="hero-logo" src="assets/logo.png" alt="">
      </header>

      <div class="hero-card">
        <p>مبيعات اليوم</p>
        <div class="big"><span id="today-total">0</span> <small>ريال</small></div>
        <div class="row-sm">
          <span>عدد الفواتير: <b id="today-count">0</b></span>
          <span>المحصّل: <b id="today-paid">0</b></span>
        </div>
      </div>

      <div class="grid-2">
        <div class="mini glass">
          <small>ذمم لنا</small>
          <b id="debts-rec">0</b>
        </div>
        <div class="mini glass">
          <small>ذمم علينا</small>
          <b id="debts-pay">0</b>
        </div>
      </div>

      <div class="actions">
        <button class="action glass" data-go="sell"><i>🧾</i><span>بيع كروت</span></button>
        <button class="action glass" data-go="cards"><i>🎫</i><span>الفئات</span></button>
        <button class="action glass" data-go="sales"><i>📊</i><span>الفواتير</span></button>
      </div>
    </section>

    <!-- الفئات -->
    <section class="view" data-view="cards">
      <header class="head"><h1>فئات الكروت</h1></header>
      <form id="card-form" class="glass form-row">
        <input id="card-name" placeholder="اسم الفئة" required>
        <input id="card-face" type="number" min="1" placeholder="القيمة" required>
        <input id="card-price" type="number" min="0" placeholder="السعر" required>
        <button class="btn-primary small" type="submit"><span>إضافة</span></button>
      </form>
      <div id="card-list" class="stack"></div>
    </section>

    <!-- البيع -->
    <section class="view" data-view="sell">
      <header class="head"><h1>بيع كروت</h1></header>
      <form id="sell-form" class="glass sell-form">
        <label class="field"><span>الفئة</span><select id="sell-type" required></select></label>
        <label class="field"><span>الكمية</span><input id="sell-qty" type="number" min="1" value="1" required></label>
        <label class="field"><span>السعر للكرت</span><input id="sell-price" type="number" min="0" required></label>
        <label class="field"><span>اسم الزبون (اختياري)</span><input id="sell-customer"></label>
        <label class="field"><span>المبلغ المدفوع</span><input id="sell-paid" type="number" min="0" value="0" required></label>
        <div class="total-box"><span>الإجمالي</span><b id="sell-total">0</b></div>
        <p id="sell-error" class="error hidden"></p>
        <button class="btn-primary" type="submit"><span>تسجيل البيع</span></button>
      </form>
    </section>

    <!-- الفواتير -->
    <section class="view" data-view="sales">
      <header class="head"><h1>الفواتير</h1></header>
      <div id="sales-list" class="stack"></div>
    </section>

    <!-- المنتجات -->
    <section class="view" data-view="products">
      <header class="head"><h1>المنتجات</h1></header>
      <form id="product-form" class="glass form-row">
        <input id="p-name" placeholder="اسم المنتج" required>
        <input id="p-sku" placeholder="الرمز (اختياري)">
        <input id="p-cost" type="number" min="0" placeholder="سعر التكلفة" required>
        <input id="p-sell" type="number" min="0" placeholder="سعر البيع" required>
        <input id="p-stock" type="number" min="0" placeholder="الكمية في المخزن" required>
        <button class="btn-primary small" type="submit"><span>إضافة منتج</span></button>
      </form>
      <div id="product-list" class="stack"></div>
    </section>

    <!-- الزبائن -->
    <section class="view" data-view="customers">
      <header class="head"><h1>الزبائن</h1></header>
      <form id="customer-form" class="glass form-row">
        <input id="c-name" placeholder="اسم الزبون" required>
        <input id="c-phone" placeholder="الهاتف (اختياري)">
        <button class="btn-primary small" type="submit"><span>إضافة زبون</span></button>
      </form>
      <div id="customer-list" class="stack"></div>
    </section>

    <!-- الديون -->
    <section class="view" data-view="debts">
      <header class="head"><h1>الديون</h1></header>
      <div class="filters">
        <button class="chip active" data-dir="receivable">ذمم لنا</button>
        <button class="chip" data-dir="payable">ذمم علينا</button>
      </div>
      <form id="debt-form" class="glass form-row">
        <input id="d-person" placeholder="اسم الشخص" required>
        <input id="d-reason" placeholder="السبب" required>
        <input id="d-amount" type="number" min="1" placeholder="المبلغ" required>
        <input id="d-paid" type="number" min="0" placeholder="المدفوع عند التسجيل (اختياري)">
        <select id="d-direction">
          <option value="receivable">لنا (عليه)</option>
          <option value="payable">علينا (لديه)</option>
        </select>
        <button class="btn-primary small" type="submit"><span>تسجيل الدين</span></button>
      </form>
      <div id="debt-list" class="stack"></div>
    </section>

    <!-- المصاريف -->
    <section class="view" data-view="expenses">
      <header class="head"><h1>المصاريف</h1></header>
      <form id="expense-form" class="glass form-row">
        <input id="e-desc" placeholder="وصف المصروف" required>
        <input id="e-amount" type="number" min="1" placeholder="المبلغ" required>
        <input id="e-category" placeholder="التصنيف (مثلاً: إيجار)">
        <button class="btn-primary small" type="submit"><span>إضافة مصروف</span></button>
      </form>
      <div id="expense-list" class="stack"></div>
    </section>

    <!-- التقارير -->
    <section class="view" data-view="reports">
      <header class="head"><h1>التقارير</h1></header>
      <div class="glass form-row">
        <label class="field"><span>من تاريخ</span><input id="r-from" type="date"></label>
        <label class="field"><span>إلى تاريخ</span><input id="r-to" type="date"></label>
        <button class="btn-primary small" id="r-show"><span>عرض التقرير</span></button>
      </div>
      <div id="report-box" class="stack"></div>
    </section>

    <!-- المزيد -->
    <section class="view" data-view="more">
      <header class="head"><h1>المزيد</h1></header>
      <div class="grid-2">
        <button class="action glass" data-go="products"><i>📦</i><span>المنتجات</span></button>
        <button class="action glass" data-go="customers"><i>👥</i><span>الزبائن</span></button>
        <button class="action glass" data-go="debts"><i>🤝</i><span>الديون</span></button>
        <button class="action glass" data-go="expenses"><i>💸</i><span>المصاريف</span></button>
        <button class="action glass" data-go="reports"><i>📈</i><span>التقارير</span></button>
        <button class="action glass" id="logout-btn"><i>⎋</i><span>خروج</span></button>
      </div>
    </section>

    <!-- شريط التنقل -->
    <nav class="tabbar">
      <button class="tab active" data-go="home"><i>🏠</i><span>الرئيسية</span></button>
      <button class="tab" data-go="sell"><i>🧾</i><span>بيع</span></button>
      <button class="tab" data-go="cards"><i>🎫</i><span>الفئات</span></button>
      <button class="tab" data-go="sales"><i>📊</i><span>الفواتير</span></button>
      <button class="tab" data-go="more"><i>☰</i><span>المزيد</span></button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
